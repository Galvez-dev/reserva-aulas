<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar Aula</title>
  <link rel="stylesheet" href="/menu/reservas/estilo.css" />
</head>
<body>
  <div class="main-container">
    <h2>Reservar Aula</h2>

    <div class="form-container">
  <form id="reservaForm">
    <div class="form-aulas-wrapper">
      <div class="inputs-container">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha" required>

        <label for="horaInicio">Hora inicio:</label>
        <input type="time" id="horaInicio" name="horaInicio" required>

        <label for="horaFin">Hora fin:</label>
        <input type="time" id="horaFin" name="horaFin" required>
      </div>

      <div class="reservas-container" id="aulasContainer" style="display: none;">
        <h2>Aulas Disponibles</h2>
        <div class="aulas-grid" id="aulasGrid">
          <!-- Las tarjetas de aulas se agregarán aquí dinámicamente -->
        </div>
      </div>
    </div>

    <div class="boton-centrado">
      <button type="button" id="buscarAulas" class="btn-reservar"> Buscar Aulas Disponibles</button>
    </div>
  </form>
</div>
    
    </div>
  </div>

  <script src="/menu/reservas/reserva.js"></script>
</body>
</html>
