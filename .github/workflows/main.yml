name: Flujo básico Node.js y Express

# Evento que dispara el flujo: cuando se hace push al repositorio
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest   # Define el sistema operativo donde se ejecutará el flujo

    steps:
      # 1️⃣ Clona el repositorio
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      # 2️⃣ Configura Node.js (elige versión estable)
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3️⃣ Instala dependencias
      - name: Instalar dependencias
        run: npm install

      # 4️⃣ Ejecuta una prueba o script (opcional, aquí solo mostramos un mensaje)
      - name: Verificar ejecución
        run: |
          echo "Servidor Express configurado correctamente"
          node -v
          npm -v

      # 5️⃣ (Opcional) Iniciar el servidor para comprobar que funciona
      - name: Iniciar servidor
        run: |
          node server.js &
          sleep 5
          echo "Servidor iniciado con éxito para demostración"
